name: Actualizar Datos Excel a JSON

on:
  push:
    paths:
      - 'datos/Datos Servicios 2.xlsx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install pandas openpyxl

      - name: Convertir Excel a JSON
        run: |
          python -c "
          import pandas as pd
          try:
              df = pd.read_excel('datos/Datos Servicios 2.xlsx', sheet_name='Hoja2')
          except Exception:
              df = pd.read_excel('datos/Datos Servicios 2.xlsx', sheet_name=0)
          df.to_json('data_procesada.json', orient='records', date_format='iso')
          "

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add data_procesada.json
          git commit -m 'Actualización automática de datos Excel [skip ci]' || echo 'No hay cambios nuevos'
          git push
