name: Actualizar Datos Excel a JSON

on:
  push:
    paths:
      - '**/*.xlsx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install pandas openpyxl

      - name: Convertir Excel a JSON
        run: |
          python -c "
          import pandas as pd
          import glob
          import os

          # Buscar cualquier archivo .xlsx en el repositorio
          archivos = glob.glob('**/*.xlsx', recursive=True)
          if not archivos:
              raise FileNotFoundError('No se encontró ningún archivo .xlsx en el repositorio')

          archivo_excel = archivos[0]
          print(f'Procesando archivo encontrado: {archivo_excel}')

          try:
              df = pd.read_excel(archivo_excel, sheet_name='Hoja2')
          except Exception:
              df = pd.read_excel(archivo_excel, sheet_name=0)

          df.to_json('data_procesada.json', orient='records', date_format='iso')
          "

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add data_procesada.json
          git commit -m 'Actualización automática de datos Excel [skip ci]' || echo 'No hay cambios nuevos'
          git push
