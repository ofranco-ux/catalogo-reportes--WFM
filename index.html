<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo de Reportes | Grupo Promass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root { --color-primary:#0a1a2b; --color-accent:#c9a84c; --color-bg:#f4f6f9; --color-white:#ffffff; --shadow-sm:0 4px 16px rgba(10,26,43,0.08); --shadow-hover:0 16px 48px rgba(10,26,43,0.14); --radius-xl:32px; --radius-lg:24px; --transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1); }
        body { font-family:'Inter',sans-serif; background:var(--color-bg); min-height:100vh; padding:2.5rem 1.5rem; display:flex; flex-direction:column; align-items:center; }
        .container { max-width:1400px; width:100%; }
        .header { text-align:center; margin-bottom:3rem; }
        .header .brand { display:inline-flex; align-items:center; gap:1rem; background:var(--color-white); padding:0.4rem 2rem 0.4rem 1.8rem; border-radius:60px; box-shadow:var(--shadow-sm); border:1px solid rgba(201,168,76,0.2); margin-bottom:0.8rem; }
        .header .brand-line { width:4px; height:40px; background:var(--color-accent); border-radius:4px; }
        .header h1 { font-weight:700; font-size:2.4rem; color:var(--color-primary); letter-spacing:-0.02em; }
        .header h1 span { color:var(--color-accent); }
        .header .subtitle { color:#5a6b7c; font-size:1.1rem; }
        .btn-back { display:inline-flex; align-items:center; gap:0.5rem; background:var(--color-white); border:1px solid rgba(10,26,43,0.08); padding:0.6rem 1.8rem; border-radius:40px; font-weight:600; color:var(--color-primary); cursor:pointer; transition:var(--transition); font-family:'Inter',sans-serif; font-size:0.95rem; margin-bottom:2rem; box-shadow:var(--shadow-sm); }
        .btn-back:hover { transform:translateX(-4px); box-shadow:var(--shadow-hover); border-color:var(--color-accent); }
        .btn-back.hidden { display:none; }
        .categorias-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:2rem; animation:fadeUp 0.6s ease-out; }
        .categoria-card { background:var(--color-white); border-radius:var(--radius-xl); padding:2.5rem 2rem; text-align:center; box-shadow:var(--shadow-sm); cursor:pointer; transition:var(--transition); border-bottom:4px solid var(--color-accent); }
        .categoria-card:hover { transform:translateY(-8px); box-shadow:var(--shadow-hover); }
        .categoria-card .icon-grande { font-size:3.6rem; display:block; margin-bottom:1rem; animation:float 3s ease-in-out infinite; }
        .categoria-card h2 { font-weight:700; font-size:1.6rem; color:var(--color-primary); }
        .categoria-card p { color:#5a6b7c; margin-top:0.4rem; font-size:0.95rem; }
        .categoria-card .badge-count { display:inline-block; background:rgba(201,168,76,0.12); color:var(--color-accent); font-weight:600; font-size:0.8rem; padding:0.2rem 1rem; border-radius:30px; margin-top:0.8rem; }
        .reportes-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:2rem; animation:fadeUp 0.6s ease-out; }
        .reportes-grid.hidden { display:none; }
        .card { background:var(--color-white); border-radius:var(--radius-lg); padding:1.8rem 1.6rem; box-shadow:var(--shadow-sm); transition:var(--transition); display:flex; flex-direction:column; border-left:5px solid var(--color-accent); }
        .card:hover { transform:translateY(-6px); box-shadow:var(--shadow-hover); }
        .card-header { display:flex; align-items:center; gap:0.75rem; margin-bottom:0.6rem; }
        .card-header .icon { font-size:2rem; line-height:1; flex-shrink:0; width:48px; height:48px; display:flex; align-items:center; justify-content:center; background:rgba(201,168,76,0.10); border-radius:16px; transition:var(--transition); animation:float 3s ease-in-out infinite; }
        .card:hover .icon { animation:none; transform:scale(1.15) rotate(6deg); background:rgba(201,168,76,0.20); }
        @keyframes float { 0% { transform:translateY(0px) scale(1); } 50% { transform:translateY(-6px) scale(1.02); } 100% { transform:translateY(0px) scale(1); } }
        .card h3 { font-weight:600; font-size:1.15rem; color:var(--color-primary); flex:1; }
        .card-footer { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.8rem; margin-top:auto; border-top:1px solid rgba(10,26,43,0.05); padding-top:1rem; }
        .card-footer a { display:inline-flex; align-items:center; gap:0.5rem; background:var(--color-primary); color:var(--color-white); text-decoration:none; padding:0.5rem 1.6rem; border-radius:40px; font-weight:600; font-size:0.85rem; transition:var(--transition); font-family:'Inter',sans-serif; }
        .card-footer a:hover { background:#1a3050; transform:scale(1.02); box-shadow:0 4px 12px rgba(10,26,43,0.20); }
        .card-footer a.local { background:#5a6b7c; }
        .card-footer a.local:hover { background:var(--color-primary); }
        .card-footer .badge { font-size:0.65rem; font-weight:600; padding:0.25rem 1rem; border-radius:30px; text-transform:uppercase; letter-spacing:0.03em; background:rgba(201,168,76,0.12); color:var(--color-accent); }
        .badge.local { background:rgba(90,107,124,0.12); color:#5a6b7c; }
        @keyframes fadeUp { 0% { opacity:0; transform:translateY(30px); } 100% { opacity:1; transform:translateY(0); } }
        @media (max-width:768px) { body { padding:1.5rem 1rem; } .header .brand { padding:0.3rem 1.2rem 0.3rem 1rem; gap:0.6rem; } .header h1 { font-size:1.8rem; } .categorias-grid { gap:1.2rem; } .categoria-card { padding:1.8rem 1.2rem; } .categoria-card .icon-grande { font-size:2.8rem; } .reportes-grid { gap:1.2rem; } }
        @media (max-width:480px) { .header h1 { font-size:1.5rem; } .card { padding:1.4rem; } }
        .hidden { display:none !important; }
        .loader { text-align:center; padding:4rem 0; color:#5a6b7c; font-size:1.2rem; }
        .loader span { display:block; font-size:3rem; margin-bottom:0.5rem; }
    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <div class="brand">
            <div class="brand-line"></div>
            <h1>📊 <span>Catálogo</span> de Reportes</h1>
        </div>
        <p class="subtitle" id="headerSubtitle">Cargando reportes...</p>
    </header>

    <button class="btn-back hidden" id="btnBack">← Volver al menú</button>

    <div id="menuCategorias" class="categorias-grid">
        <div class="loader"><span>⏳</span>Cargando reportes...</div>
    </div>

    <div id="reportesContainer" class="reportes-grid hidden"></div>
</div>

<script>
    // ================================================================
    //  DATOS INCRUSTADOS (FALLBACK ACTUALIZADO)
    // ================================================================
    const fallbackData = {
        "categorias": {
            "Retenciones": {
                "icono": "🛡️",
                "descripcion": "Reportes de gestión de retenciones y métricas asociadas.",
                "reportes": [
                    { "nombre": "Indicadores", "url": "https://datastudio.google.com/reporting/156eeb53-9e7d-4791-8614-3ef3691b8d26", "icono": "📈" },
                    { "nombre": "Tipificaciones", "url": "https://datastudio.google.com/reporting/53bc61d9-54d9-4433-86ed-32a91243d68a", "icono": "🏷️" },
                    { "nombre": "AHT", "url": "https://datastudio.google.com/reporting/f1d96beb-1f1b-4a65-a047-163f63301904", "icono": "⏱️" },
                    { "nombre": "Llamadas cortadas", "url": "https://datastudio.google.com/reporting/5caf4a3e-3f04-4f23-a558-11220ee4e875", "icono": "📞" },
                    { "nombre": "Indicadores por hora", "url": "https://datastudio.google.com/s/kFX5PQJuLdM", "icono": "🕐" },
                    { "nombre": "Perks Up", "url": "https://datastudio.google.com/reporting/a51dc951-2f02-43b3-ab8f-0165ae61b985/page/p_yg2o7u6w1d", "icono": "🎯" },
                    { "nombre": "FCR & CSAT", "url": "https://datastudio.google.com/reporting/697c96d0-7d1b-44d4-ae68-deb8eddf9cf7/page/p_9dy8uzr00d", "icono": "⭐" },
                    { "nombre": "Llamadas por agente", "url": "https://datastudio.google.com/s/tVTnsp3bJSI", "icono": "📞" },
                    { "nombre": "Reporte de incidencias", "url": "https://docs.google.com/forms/d/1IQlCiCUWeEcNkJ6xlDVlOHP83ZTRNwqX8nNC-2ulu4Y/edit#responses", "icono": "📝" }
                ]
            },
            "Servicios": {
                "icono": "🔧",
                "descripcion": "Reportes del área de servicios y atención al cliente.",
                "reportes": [
                    { "nombre": "Histórico indicadores", "url": "https://datastudio.google.com/reporting/dd6e412f-60c5-4129-af9e-5e8fee95400c", "icono": "📈" },
                    { "nombre": "Tipificaciones", "url": "https://datastudio.google.com/reporting/53bc61d9-54d9-4433-86ed-32a91243d68a", "icono": "🏷️" },
                    { "nombre": "AHT", "url": "https://datastudio.google.com/reporting/f1d96beb-1f1b-4a65-a047-163f63301904", "icono": "⏱️" },
                    { "nombre": "Llamadas cortadas", "url": "https://datastudio.google.com/reporting/5caf4a3e-3f04-4f23-a558-11220ee4e875", "icono": "📞" },
                    { "nombre": "Indicadores por hora", "url": "https://datastudio.google.com/s/kFX5PQJuLdM", "icono": "🕐" },
                    { "nombre": "FCR & CSAT", "url": "https://datastudio.google.com/reporting/697c96d0-7d1b-44d4-ae68-deb8eddf9cf7/page/p_9dy8uzr00d", "icono": "⭐" },
                    { "nombre": "Rellamado", "url": "https://datastudio.google.com/reporting/671b554b-490e-41fb-a7e1-388b80bd26e7", "icono": "🔄" },
                    { "nombre": "Llamadas por agente", "url": "https://datastudio.google.com/s/tVTnsp3bJSI", "icono": "📞" },
                    { "nombre": "Tracking Servicios", "url": "Seguimiento Servicios.html", "icono": "📋", "local": true },
                    { "nombre": "Tiempos de servicio", "url": "Tiempos de servicios.html", "icono": "📋", "local": true },
                    { "nombre": "Tiempos de servicio RT", "url": "Seguimiento Servicios RT.html", "icono": "📋", "local": true },
                    { "nombre": "Reporte de incidencias", "url": "https://docs.google.com/forms/d/1IQlCiCUWeEcNkJ6xlDVlOHP83ZTRNwqX8nNC-2ulu4Y/edit#responses", "icono": "📝" }
                ]
            },
            "Hexalud": {
                "icono": "🏥",
                "descripcion": "Reportes del área de salud y bienestar (Hexalud).",
                "reportes": [
                    { "nombre": "Histórico indicadores", "url": "https://datastudio.google.com/reporting/dd6e412f-60c5-4129-af9e-5e8fee95400c", "icono": "📈" },
                    { "nombre": "Tipificaciones", "url": "https://datastudio.google.com/reporting/53bc61d9-54d9-4433-86ed-32a91243d68a", "icono": "🏷️" },
                    { "nombre": "AHT", "url": "https://datastudio.google.com/reporting/f1d96beb-1f1b-4a65-a047-163f63301904", "icono": "⏱️" },
                    { "nombre": "Llamadas cortadas", "url": "https://datastudio.google.com/reporting/5caf4a3e-3f04-4f23-a558-11220ee4e875", "icono": "📞" },
                    { "nombre": "Indicadores por hora", "url": "https://datastudio.google.com/s/kFX5PQJuLdM", "icono": "🕐" },
                    { "nombre": "FCR & CSAT", "url": "https://datastudio.google.com/reporting/697c96d0-7d1b-44d4-ae68-deb8eddf9cf7/page/p_9dy8uzr00d", "icono": "⭐" },
                    { "nombre": "Llamadas por agente", "url": "https://datastudio.google.com/s/tVTnsp3bJSI", "icono": "📞" },
                    { "nombre": "Reporte de incidencias", "url": "https://docs.google.com/forms/d/1IQlCiCUWeEcNkJ6xlDVlOHP83ZTRNwqX8nNC-2ulu4Y/edit#responses", "icono": "📝" }
                ]
            },
            "Ventas": {
                "icono": "💰",
                "descripcion": "Reportes del área de ventas y rendimiento comercial.",
                "reportes": [
                    { "nombre": "Ventas por agente", "url": "https://datastudio.google.com/reporting/fc7fd1aa-c7cb-4fb0-ad2c-cf1b4efe7eff/page/p_igtp01pz5d", "icono": "💰" },
                    { "nombre": "Reporte de incidencias", "url": "https://docs.google.com/forms/d/1IQlCiCUWeEcNkJ6xlDVlOHP83ZTRNwqX8nNC-2ulu4Y/edit#responses", "icono": "📝" }
                ]
            }
        }
    };

    // ================================================================
    //  REFERENCIAS DOM
    // ================================================================
    const menuCategorias = document.getElementById('menuCategorias');
    const reportesContainer = document.getElementById('reportesContainer');
    const btnBack = document.getElementById('btnBack');
    const headerSubtitle = document.getElementById('headerSubtitle');

    let categorias = {};

    // ================================================================
    //  CARGA DE DATOS (EXTERNO + FALLBACK)
    // ================================================================
    async function cargarDatos() {
        try {
            const basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
            const posiblesNombres = ['informes.json', 'reportes.json', 'Informes.json'];
            let data = null;

            for (const nombre of posiblesNombres) {
                const url = basePath + nombre;
                console.log(`Intentando cargar: ${url}`);
                try {
                    const response = await fetch(url);
                    if (response.ok) {
                        data = await response.json();
                        console.log(`✅ Cargado correctamente desde: ${nombre}`);
                        break;
                    }
                } catch (e) {
                    console.warn(`No se pudo cargar ${nombre}:`, e.message);
                }
            }

            // Si no se cargó ningún JSON externo, se utiliza el fallback
            if (!data) {
                console.warn('⚠️ No se encontró JSON externo. Usando datos incrustados (fallback).');
                data = fallbackData;
            }

            categorias = data.categorias;
            
            renderMenu();
            headerSubtitle.textContent = 'Selecciona una categoría para ver sus reportes';
            
        } catch (error) {
            console.error('Error crítico:', error);
            if (Object.keys(categorias).length === 0) {
                categorias = fallbackData.categorias;
                renderMenu();
                headerSubtitle.textContent = 'Usando datos de respaldo (sin conexión)';
            }
        }
    }

    // ================================================================
    //  RENDERIZADO
    // ================================================================
    function renderMenu() {
        const keys = Object.keys(categorias);
        if (keys.length === 0) {
            menuCategorias.innerHTML = `<div class="loader" style="grid-column:1/-1;"><span>📭</span>No hay reportes disponibles.</div>`;
            return;
        }

        const html = keys.map(nombre => {
            const data = categorias[nombre];
            return `
                <div class="categoria-card" data-categoria="${nombre}">
                    <span class="icon-grande">${data.icono}</span>
                    <h2>${nombre}</h2>
                    <p>${data.descripcion}</p>
                    <span class="badge-count">${data.reportes.length} reportes</span>
                </div>
            `;
        }).join('');
        menuCategorias.innerHTML = html;
        menuCategorias.classList.remove('hidden');

        document.querySelectorAll('.categoria-card').forEach(el => {
            el.addEventListener('click', function() {
                mostrarReportes(this.dataset.categoria);
            });
        });
    }

    function mostrarReportes(categoria) {
        const data = categorias[categoria];
        if (!data) return;

        menuCategorias.classList.add('hidden');
        reportesContainer.classList.remove('hidden');
        btnBack.classList.remove('hidden');
        headerSubtitle.textContent = `📂 ${categoria} — ${data.reportes.length} reportes`;

        const html = data.reportes.map(r => {
            const esLocal = r.local || (r.url && r.url.startsWith('file://'));
            const esForm = r.url && r.url.includes('docs.google.com/forms');
            const target = esLocal ? '_self' : '_blank';
            const rel = esLocal ? '' : 'rel="noopener noreferrer"';
            const badgeClase = esLocal ? 'local' : '';
            
            let badgeTexto = '🌐 Looker Studio';
            if (esLocal) {
                badgeTexto = '📂 Local';
            } else if (esForm) {
                badgeTexto = '📝 Google Forms';
            }

            const botonClase = esLocal ? 'local' : '';

            return `
                <div class="card">
                    <div class="card-header">
                        <span class="icon">${r.icono || '📄'}</span>
                        <h3>${r.nombre}</h3>
                    </div>
                    <div class="card-footer">
                        <a href="${r.url}" target="${target}" ${rel} class="${botonClase}">
                            Abrir reporte →
                        </a>
                        <span class="badge ${badgeClase}">${badgeTexto}</span>
                    </div>
                </div>
            `;
        }).join('');
        reportesContainer.innerHTML = html;
    }

    function volverMenu() {
        reportesContainer.classList.add('hidden');
        btnBack.classList.add('hidden');
        menuCategorias.classList.remove('hidden');
        headerSubtitle.textContent = 'Selecciona una categoría para ver sus reportes';
        reportesContainer.innerHTML = '';
    }

    btnBack.addEventListener('click', volverMenu);

    // ================================================================
    //  INICIO
    // ================================================================
    cargarDatos();
</script>

</body>
</html>
