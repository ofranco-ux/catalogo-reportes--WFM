<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WFM | Portal de Reportes Promass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --promass-navy: #003865;
            --promass-gold: #EAB308;
            --promass-gold-hover: #CA8A04;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --border-card: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --btn-bg: #f1f5f9;
            --btn-hover: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        [data-theme="dark"] {
            --bg-main: #0b132b;
            --bg-card: #1c2541;
            --border-card: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(234, 179, 8, 0.15);
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
            --shadow-lg: 0 10px 25px -5px rgb(0 0 0 / 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation Header */
        .top-nav {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-card);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(8px);
            box-shadow: var(--shadow-sm);
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-svg {
            height: 38px;
            width: auto;
        }

        .theme-toggle {
            background: var(--btn-bg);
            border: 1px solid var(--border-card);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 9999px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .theme-toggle:hover {
            background: var(--btn-hover);
        }

        /* Main Hero & Search Section */
        .hero-section {
            padding: 40px 24px 20px;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .main-title {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            color: var(--text-primary);
            margin-bottom: 24px;
        }

        .main-title span {
            color: var(--promass-gold);
        }

        .search-container {
            position: relative;
            max-width: 560px;
            margin: 0 auto;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px 16px 52px;
            font-size: 1rem;
            font-family: inherit;
            border-radius: 16px;
            border: 2px solid var(--border-card);
            background: var(--bg-card);
            color: var(--text-primary);
            box-shadow: var(--shadow-md);
            outline: none;
        }

        .search-input:focus {
            border-color: var(--promass-gold);
            box-shadow: 0 0 0 4px rgba(234, 179, 8, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--text-secondary);
        }

        /* Category Filter Tabs */
        .tabs-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 20px;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            border: 1px solid var(--border-card);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            border-color: var(--promass-gold);
            color: var(--text-primary);
        }

        .tab-btn.active {
            background: var(--promass-navy);
            color: #ffffff;
            border-color: var(--promass-navy);
        }

        [data-theme="dark"] .tab-btn.active {
            background: var(--promass-gold);
            color: #000000;
            border-color: var(--promass-gold);
        }

        /* Content Grid */
        .content-section {
            max-width: 1280px;
            margin: 32px auto 60px;
            padding: 0 24px;
            width: 100%;
            flex: 1;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 28px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border-card);
            margin-bottom: 16px;
        }

        .card-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(0, 56, 101, 0.08);
            color: var(--promass-navy);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        [data-theme="dark"] .card-icon {
            background: rgba(234, 179, 8, 0.15);
            color: var(--promass-gold);
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .report-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .report-item-btn {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-card);
            background: var(--btn-bg);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.925rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            text-align: left;
        }

        .report-item-btn:hover {
            border-color: var(--promass-gold);
            background: var(--btn-hover);
            transform: translateX(4px);
        }

        .report-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .report-icon {
            font-size: 1rem;
            opacity: 0.8;
        }

        .arrow-icon {
            width: 16px;
            height: 16px;
            color: var(--text-secondary);
            transition: transform 0.2s ease;
        }

        .report-item-btn:hover .arrow-icon {
            transform: translateX(4px);
            color: var(--promass-gold);
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }

        /* Footer */
        .footer {
            background: var(--bg-card);
            border-top: 1px solid var(--border-card);
            padding: 24px;
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: auto;
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
            .main-title {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body data-theme="light">

    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="nav-container">
            <a href="#" class="brand-logo">
                <svg class="logo-svg" viewBox="0 0 450 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Isotipo S Promass -->
                    <path d="M48.5 22L72 38.5V22L48.5 22Z" fill="#003865"/>
                    <path d="M48.5 22L25 38.5H72L48.5 22Z" fill="#003865"/>
                    <path d="M72 38.5L95.5 55H72V38.5Z" fill="#EAB308"/>
                    <path d="M25 38.5C25 38.5 25 68 48.5 68C72 68 72 97.5 72 97.5H25" stroke="#003865" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M72 97.5L48.5 114V97.5H72Z" fill="#003865"/>
                    <path d="M48.5 114L25 97.5H72L48.5 114Z" fill="#003865"/>
                    
                    <!-- Texto GRUPO -->
                    <text x="110" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#003865" letter-spacing="3" transform="rotate(-90 110 58)">GRUPO</text>
                    
                    <!-- Texto PROMASS -->
                    <text x="125" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="48" fill="#003865" letter-spacing="-1">PRO</text>
                    <text x="228" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="48" fill="#EAB308" letter-spacing="-1">MASS</text>
                    
                    <!-- Eslogan -->
                    <text x="126" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="18" fill="#003865" letter-spacing="0.2">Acelerando el potencial de tu negocio</text>
                </svg>
            </a>

            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">
                <span id="themeIcon">🌙</span>
                <span id="themeText">Modo Oscuro</span>
            </button>
        </div>
    </nav>

    <!-- Main Hero -->
    <header class="hero-section">
        <h1 class="main-title">Catálogo de <span>Reportes WFM</span></h1>

        <!-- Search Bar -->
        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" class="search-input" onkeyup="filtrarReportes()" placeholder="Buscar por nombre de reporte o categoría...">
        </div>

        <!-- Filter Tabs -->
        <div class="tabs-container">
            <button class="tab-btn active" onclick="filtrarTab('all', this)">
                <span>🌐</span> Todos
            </button>
            <button class="tab-btn" onclick="filtrarTab('Servicios', this)">
                <span>⚙️</span> Servicios
            </button>
            <button class="tab-btn" onclick="filtrarTab('Retenciones', this)">
                <span>🛡️</span> Retenciones
            </button>
            <button class="tab-btn" onclick="filtrarTab('Hexalud', this)">
                <span>🩺</span> Hexalud
            </button>
        </div>
    </header>

    <!-- Content Grid -->
    <main class="content-section">
        <div class="grid-container" id="app-container">
            <!-- Las tarjetas se generan dinámicamente con JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        &copy; 2026 Grupo Promass — Workforce Management System
    </footer>

    <script>
        const catalogo = [
            {
                "id": "Servicios",
                "nombre": "Reportería Servicios",
                "icono": "⚙️",
                "reportes": [
                    { "nombre": "Indicadores", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbxvw5X6dnlMKs793MbaH7DhHJShI_UaT-KpoY750Tdmjz0ynuWeiTUGbgM5_mC9-0vu/exec", "ico": "📈" },
                    { "nombre": "AHT", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbyg_eGGfy9h_cVQXbYVccR5xVyEtdgcLrDBvw1s2-IS7jaL7IYICCLhJlMfrA6Wa4DM/exec", "ico": "⏱️" },
                    { "nombre": "Tipificaciones", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbzwyLe7wJYHogvapa1acoHQcZvFhfkFwcZniPn4CBOpVlxXiOEgdfqRvPlusPxic-Y2/exec", "ico": "🏷️" },
                    { "nombre": "Auxiliares", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbx8VMVE3oq4Y4SFHA5281OqthmdWUa178-4YsDbC8b4ZqoL6Kf0_GjWZGxT0__bIsKY4Q/exec", "ico": "📋" },
                    { "nombre": "Rellamado", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbxabTH7Fy3Xtdbp_rz7UDE8mQ-KT9WBwRGNirISeiDoopXlfrc4yFrOOQAToTg59mA4/exec", "ico": "🔄" },
                    { "nombre": "Llamadas por agente", "liga": "https://script.google.com/macros/s/AKfycbye6D2JFZpjm0SdDXJWx2lvvDBHy68lqweC0Dwb_pDktIUGLN9pXAqas36kcq5z4FgY/exec", "ico": "📞" },
                    { "nombre": "HeadCount", "liga": "https://wfmpromass2026.pythonanywhere.com/", "ico": "👥" }
                ]
            },
            {
                "id": "Retenciones",
                "nombre": "Reportería Retenciones y Experiencias",
                "icono": "🛡️",
                "reportes": [
                    { "nombre": "Indicadores", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbyC-QnyZzMwi5JNghf3jnS66-ZzhLJAxkjD6m6Fp-U6VsBHSVWitp9GrQjqs2jlCts3hw/exec", "ico": "📈" },
                    { "nombre": "AHT", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbwbsBN-VMxiym7t_zZ67POkq_h4A-IN8MNDfKlOsqSLybo6QGP9DKrfUZubLhtyL2PS/exec", "ico": "⏱️" },
                    { "nombre": "Tipificaciones", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbys-6Ji7InYvgGkqiUhMoYxh0xq24_WCeumof6Z14OTZiC9Mz38NE3_2r_VRTkD-xLX/exec", "ico": "🏷️" },
                    { "nombre": "Auxiliares", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbxlsyjwF5iuE-jkkvZb-8BYNmKDEUe6agWN2a2bMmFbMPGXv_a7-J-ayA2iBINmwj4Aww/exec", "ico": "📋" },
                    { "nombre": "Llamadas por agente", "liga": "https://script.google.com/macros/s/AKfycbylDqEzlwHW-lrNCaHXjcQ9kAQCVtY9DCVYV_S0Fq-7l2_iiRWkOLf0DIr2eSkChQzA-g/exec", "ico": "📞" },
                    { "nombre": "HeadCount", "liga": "https://wfmpromass2026.pythonanywhere.com/", "ico": "👥" }
                ]
            },
            {
                "id": "Hexalud",
                "nombre": "Reportería Hexalud",
                "icono": "🩺",
                "reportes": [
                    { "nombre": "Indicadores", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbzCLeSWTi6NW7RDNCP9rKG_rNvM-HUwKNUBwBqVQcZHBUN8DGnsduv7cPvf_6H5jEf9NQ/exec", "ico": "📈" },
                    { "nombre": "AHT", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbyqwSzb-HRi1UGl_Kc0xJyoThqs4Av-rsd9V8YMiH1CMSlXbFTWB-f5piEwkIfzVa_c/exec", "ico": "⏱️" },
                    { "nombre": "Tipificaciones", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbwZ3sxJOuhK3u5Rcx5oTUFwQpN3odvfM_I_N9r9JrNFop_LcUgmUs3ppPLeSgnPuTBs/exec", "ico": "🏷️" },
                    { "nombre": "Auxiliares", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbz2IVH8kP0H3zSLLyFGea5nhzR-x8dzpvDgbNUC3VxSuLwhsbyJBw6i87aOFjfzUXsB/exec", "ico": "📋" },
                    { "nombre": "Llamadas por agente", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbz_3p9IArAst7Yop4MBvABfabGTG6cpVpMtG1kw1szoscDgVSZNxHOds0V_s4LiON5WGA/exec", "ico": "📞" },
                    { "nombre": "HeadCount", "liga": "https://wfmpromass2026.pythonanywhere.com/", "ico": "👥" }
                ]
            }
        ];

        let currentTab = 'all';

        function abrirReporte(url) {
            window.open(url, '_blank', 'noopener,noreferrer');
        }

        function renderizar(datos) {
            const contenedor = document.getElementById('app-container');
            contenedor.innerHTML = '';
            
            if (datos.length === 0) {
                contenedor.innerHTML = `
                    <div class="no-results">
                        <h3>No se encontraron reportes</h3>
                        <p>Intenta con otra búsqueda o selecciona otra categoría.</p>
                    </div>`;
                return;
            }

            datos.forEach(operacion => {
                let cardHTML = `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon">${operacion.icono}</div>
                            <h2 class="card-title">${operacion.nombre}</h2>
                        </div>
                        <ul class="report-list">`;
                
                operacion.reportes.forEach(reporte => {
                    cardHTML += `
                        <li>
                            <button class="report-item-btn" onclick="abrirReporte('${reporte.liga}')">
                                <div class="report-info">
                                    <span class="report-icon">${reporte.ico}</span>
                                    <span>${reporte.nombre}</span>
                                </div>
                                <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="9 18 15 12 9 6"></polyline>
                                </svg>
                            </button>
                        </li>`;
                });
                
                cardHTML += `</ul></div>`;
                contenedor.innerHTML += cardHTML;
            });
        }

        function filtrarReportes() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            const filtrados = catalogo
                .filter(op => currentTab === 'all' || op.id === currentTab)
                .map(operacion => {
                    const reportesFiltrados = operacion.reportes.filter(r => 
                        r.nombre.toLowerCase().includes(query) || operacion.nombre.toLowerCase().includes(query)
                    );
                    return { ...operacion, reportes: reportesFiltrados };
                })
                .filter(operacion => operacion.reportes.length > 0);

            renderizar(filtrados);
        }

        function filtrarTab(tabId, btnElement) {
            currentTab = tabId;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            filtrarReportes();
        }

        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('themeText');
            const themeIcon = document.getElementById('themeIcon');

            if (body.getAttribute('data-theme') === 'light') {
                body.setAttribute('data-theme', 'dark');
                themeBtn.textContent = 'Modo Claro';
                themeIcon.textContent = '☀️';
            } else {
                body.setAttribute('data-theme', 'light');
                themeBtn.textContent = 'Modo Oscuro';
                themeIcon.textContent = '🌙';
            }
        }

        // Carga inicial
        renderizar(catalogo);
    </script>
</body>
</html>
