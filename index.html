<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WFM | Portal de Reportes Grupo Promass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0f1d;
            --card-bg: rgba(18, 26, 47, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --promass-blue: #003865;
            --promass-cyan: #38bdf8;
            --promass-gold: #EAB308;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --btn-bg: rgba(255, 255, 255, 0.03);
            --btn-hover: rgba(56, 189, 248, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 56, 101, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(234, 179, 8, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Ejecutivo */
        header {
            background: rgba(10, 15, 29, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            padding: 20px 32px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-content {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .svg-logo {
            height: 44px;
            width: auto;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.02em;
            border-left: 1px solid var(--card-border);
            padding-left: 20px;
        }

        .header-title span {
            color: var(--promass-gold);
        }

        /* Grid Principal */
        main {
            max-width: 1280px;
            margin: 48px auto;
            padding: 0 24px;
            width: 100%;
            flex: 1;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 28px;
        }

        /* Tarjetas de Operación (Glassmorphism) */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 28px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #003865, var(--promass-gold));
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
        }

        .card-icon {
            font-size: 1.5rem;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        /* Lista de Reportes */
        .report-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .report-btn {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: var(--btn-bg);
            color: var(--text-main);
            font-size: 0.925rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .report-btn:hover {
            background: var(--btn-hover);
            border-color: rgba(56, 189, 248, 0.4);
            color: var(--promass-cyan);
            transform: translateX(4px);
        }

        .report-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .report-icon {
            font-size: 1rem;
            opacity: 0.8;
        }

        .arrow {
            font-size: 0.85rem;
            opacity: 0.4;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .report-btn:hover .arrow {
            opacity: 1;
            transform: translateX(3px);
            color: var(--promass-cyan);
        }

        footer {
            text-align: center;
            padding: 24px;
            font-size: 0.85rem;
            color: var(--text-sub);
            border-top: 1px solid var(--card-border);
            margin-top: auto;
            background: rgba(10, 15, 29, 0.9);
        }

        @media (max-width: 768px) {
            .header-title {
                display: none;
            }
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Header con Logo Oficial SVG Integrado -->
    <header>
        <div class="header-content">
            <div class="brand-container">
                <svg class="svg-logo" viewBox="0 0 450 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M48.5 22L72 38.5V22L48.5 22Z" fill="#38bdf8"/>
                    <path d="M48.5 22L25 38.5H72L48.5 22Z" fill="#38bdf8"/>
                    <path d="M72 38.5L95.5 55H72V38.5Z" fill="#EAB308"/>
                    <path d="M25 38.5C25 38.5 25 68 48.5 68C72 68 72 97.5 72 97.5H25" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M72 97.5L48.5 114V97.5H72Z" fill="#38bdf8"/>
                    <path d="M48.5 114L25 97.5H72L48.5 114Z" fill="#38bdf8"/>
                    <text x="110" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="3" transform="rotate(-90 110 58)">GRUPO</text>
                    <text x="125" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="48" fill="#ffffff" letter-spacing="-1">PRO</text>
                    <text x="228" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="48" fill="#EAB308" letter-spacing="-1">MASS</text>
                    <text x="126" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="18" fill="#94a3b8" letter-spacing="0.2">Acelerando el potencial de tu negocio</text>
                </svg>
                <div class="header-title">Catálogo de <span>Reportes WFM</span></div>
            </div>
        </div>
    </header>

    <!-- Contenedor Principal de Tarjetas -->
    <main>
        <div class="grid" id="app-container">
        </div>
    </main>

    <footer>
        &copy; 2026 Grupo Promass — Workforce Management System
    </footer>

    <script>
        const catalogo = [
            {
                "nombre": "Reportería Servicios",
                "icono": "⚙️",
                "reportes": [
                    { "nombre": "Indicadores", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbxvw5X6dnlMKs793MbaH7DhHJShI_UaT-KpoY750Tdmjz0ynuWeiTUGbgM5_mC9-0vu/exec", "ico": "📈" },
                    { "nombre": "AHT", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbyg_eGGfy9h_cVQXbYVccR5xVyEtdgcLrDBvw1s2-IS7jaL7IYICCLhJlMfrA6Wa4DM/exec", "ico": "⏱️" },
                    { "nombre": "Tipificaciones", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbzwyLe7wJYHogvapa1acoHQcZvFhfkFwcZniPn4CBOpVlxXiOEgdfqRvPlusPxic-Y2/exec", "ico": "🏷️" },
                    { "nombre": "Auxiliares", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbx8VMVE3oq4Y4SFHA5281OqthmdWUa178-4YsDbC8b4ZqoL6Kf0_GjWZGxT0__bIsKY4Q/exec", "ico": "📋" },
                    { "nombre": "Rellamado", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbxabTH7Fy3Xtdbp_rz7UDE8mQ-KT9WBwRGNirISeiDoopXlfrc4yFrOOQAToTg59mA4/exec", "ico": "🔄" },
                    { "nombre": "Llamadas por agente", "liga": "https://script.google.com/macros/s/AKfycbye6D2JFZpjm0SdDXJWx2lvvDBHy68lqweC0Dwb_pDktIUGLN9pXAqas36kcq5z4FgY/exec", "ico": "📞" },
                    { "nombre": "HeadCount", "liga": "https://wfmpromass2026.pythonanywhere.com/", "ico": "👥" }
                ]
            },
            {
                "nombre": "Reportería Retenciones y Experiencias",
                "icono": "🛡️",
                "reportes": [
                    { "nombre": "Indicadores", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbyC-QnyZzMwi5JNghf3jnS66-ZzhLJAxkjD6m6Fp-U6VsBHSVWitp9GrQjqs2jlCts3hw/exec", "ico": "📈" },
                    { "nombre": "AHT", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbwbsBN-VMxiym7t_zZ67POkq_h4A-IN8MNDfKlOsqSLybo6QGP9DKrfUZubLhtyL2PS/exec", "ico": "⏱️" },
                    { "nombre": "Tipificaciones", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbys-6Ji7InYvgGkqiUhMoYxh0xq24_WCeumof6Z14OTZiC9Mz38NE3_2r_VRTkD-xLX/exec", "ico": "🏷️" },
                    { "nombre": "Auxiliares", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbxlsyjwF5iuE-jkkvZb-8BYNmKDEUe6agWN2a2bMmFbMPGXv_a7-J-ayA2iBINmwj4Aww/exec", "ico": "📋" },
                    { "nombre": "Llamadas por agente", "liga": "https://script.google.com/macros/s/AKfycbylDqEzlwHW-lrNCaHXjcQ9kAQCVtY9DCVYV_S0Fq-7l2_iiRWkOLf0DIr2eSkChQzA-g/exec", "ico": "📞" },
                    { "nombre": "HeadCount", "liga": "https://wfmpromass2026.pythonanywhere.com/", "ico": "👥" }
                ]
            },
            {
                "nombre": "Reportería Hexalud",
                "icono": "🩺",
                "reportes": [
                    { "nombre": "Indicadores", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbzCLeSWTi6NW7RDNCP9rKG_rNvM-HUwKNUBwBqVQcZHBUN8DGnsduv7cPvf_6H5jEf9NQ/exec", "ico": "📈" },
                    { "nombre": "AHT", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbyqwSzb-HRi1UGl_Kc0xJyoThqs4Av-rsd9V8YMiH1CMSlXbFTWB-f5piEwkIfzVa_c/exec", "ico": "⏱️" },
                    { "nombre": "Tipificaciones", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbwZ3sxJOuhK3u5Rcx5oTUFwQpN3odvfM_I_N9r9JrNFop_LcUgmUs3ppPLeSgnPuTBs/exec", "ico": "🏷️" },
                    { "nombre": "Auxiliares", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbz2IVH8kP0H3zSLLyFGea5nhzR-x8dzpvDgbNUC3VxSuLwhsbyJBw6i87aOFjfzUXsB/exec", "ico": "📋" },
                    { "nombre": "Llamadas por agente", "liga": "https://script.google.com/a/macros/gpmass.com/s/AKfycbz_3p9IArAst7Yop4MBvABfabGTG6cpVpMtG1kw1szoscDgVSZNxHOds0V_s4LiON5WGA/exec", "ico": "📞" },
                    { "nombre": "HeadCount", "liga": "https://wfmpromass2026.pythonanywhere.com/", "ico": "👥" }
                ]
            }
        ];

        function abrirReporte(url) {
            window.open(url, '_blank', 'noopener,noreferrer');
        }

        function renderizar() {
            const container = document.getElementById('app-container');
            container.innerHTML = '';

            catalogo.forEach(op => {
                let html = `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon">${op.icono}</div>
                            <h2 class="card-title">${op.nombre}</h2>
                        </div>
                        <ul class="report-list">`;
                
                op.reportes.forEach(rep => {
                    html += `
                        <li>
                            <button class="report-btn" onclick="abrirReporte('${rep.liga}')">
                                <div class="report-info">
                                    <span class="report-icon">${rep.ico}</span>
                                    <span>${rep.nombre}</span>
                                </div>
                                <span class="arrow">➔</span>
                            </button>
                        </li>`;
                });

                html += `</ul></div>`;
                container.innerHTML += html;
            });
        }

        renderizar();
    </script>
</body>
</html>
