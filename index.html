<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Reportes WFM</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 25px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .card h2 {
            color: #3498db;
            font-size: 1.4em;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .report-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .report-list li {
            margin: 12px 0;
        }
        .report-list a {
            text-decoration: none;
            color: #2c3e50;
            font-weight: 500;
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 6px;
            background-color: #f8f9fa;
            transition: background-color 0.2s;
        }
        .report-list a:hover {
            background-color: #e9ecef;
            color: #3498db;
        }
        .icon {
            margin-right: 10px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Catálogo de Reportes WFM</h1>
        <p>Selecciona una operación para visualizar sus reportes</p>
    </div>

    <div class="container" id="app-container">
    </div>

    <script>
        const catalogo = [
            {
                "nombre": "Reportería Servicios",
                "reportes": [
                    { "nombre": "Indicadores", "liga": "https://script.google.com/macros/s/AKfycbxvw5X6dnIMKs793MbaH7DhHJShI_UaT-KpoY750Tdmjz0ynuWeiTUGbgM5_mC9-0vu/exec" },
                    { "nombre": "AHT", "liga": "https://script.google.com/macros/s/AKfycbyg_eGGfy9h_cVQXbYVccR5xVyEtdgcLrDBvw1s2-IS7jaL7lYICCLhJlMfrA6Wa4DM/exec" },
                    { "nombre": "Tipificaciones", "liga": "https://script.google.com/macros/s/AKfycbzwyLe7wJYHogvapa1acoHQcZvFhfkFwcZniPn4CBOpVIxXiOEgdfqRvPlusPxic-Y2/exec" },
                    { "nombre": "Auxiliares", "liga": "https://script.google.com/macros/s/AKfycbx8VMVE3oq4Y4SFHA5281OqthmdWUa178-4YsDBc8b4Zqol6Kf0_GjWZGxT0_blsKY4Q/exec" },
                    { "nombre": "Rellamado", "liga": "https://script.google.com/macros/s/AKfycbxabTH7Fy3Xtdbp_rz7UDE8mQ-KT9WBwRGNIrlSeiDoopXlfrc4yFrOOQAToTg59mA4/exec" },
                    { "nombre": "Llamadas por agente", "liga": "https://script.google.com/macros/s/AKfycbye6D2JFZpjm0SdDXJWx2lvvDBHy68IqweC0Dwb_pDktIUGLN9pXAgas36kcq5z4FgY/exec" },
                    { "nombre": "HeadCount", "liga": "https://wfmpromass2026.pythonanywhere.com/" }
                ]
            },
            {
                "nombre": "Reportería Retenciones y Experiencias",
                "reportes": [
                    { "nombre": "Indicadores", "liga": "https://script.google.com/macros/s/AKfycbxC-QnyZzMwi5JNGhf3jnS66-ZzhLJAxkjD6m6Fp-U6VsBHSVWitp9GrQjqs2jlCts3hw/exec" },
                    { "nombre": "AHT", "liga": "https://script.google.com/macros/s/AKfycbwbsBN-VMxiym7t_zZ67POkq_h4A-IN8MNDfKlOsSlybo6QGP9DKrfUZubLhtyL2PS/exec" },
                    { "nombre": "Tipificaciones", "liga": "https://script.google.com/macros/s/AKfycbys-6Ji7InYvgGkqiUhMoYxh0xq24_WCeumof6Z14OTZiC9Mz38NE3_2r_VRTkD-xLX/exec" },
                    { "nombre": "Auxiliares", "liga": "https://script.google.com/macros/s/AKfycbxlsyjwF5iuE-jkkvZb-8BYNmKDEUe6agWN2a2bMmFbMPGXv_a7-J-ayA2iBlNmwj4Aww/exec" },
                    { "nombre": "Llamadas por agente", "liga": "https://script.google.com/macros/s/AKfycbylDqEzlWHW-lrNCaHXjcQ9kAQCVtY9DCVYV_S0Fq-7I2_iiRWkOLf0DlR2eSkChQzA-g/exec" },
                    { "nombre": "HeadCount", "liga": "https://wfmpromass2026.pythonanywhere.com/" }
                ]
            },
            {
                "nombre": "Reportería Hexalud",
                "reportes": [
                    { "nombre": "Indicadores", "liga": "https://script.google.com/macros/s/AKfycbzCLeSWTi6NW7RDNCP9rKG_rNvM-HUwKNUBwBqVQcZHBUN8DGnsduv7cPvf_6H5jEf9NQ/exec" },
                    { "nombre": "AHT", "liga": "https://script.google.com/macros/s/AKfycbyqwSzb-HRi1UGl_KcOxJyoThqs4Av-rsd9V8YMiH1CMSlXbFTWB-f5piEwklfzVa_c/exec" },
                    { "nombre": "Tipificaciones", "liga": "https://script.google.com/macros/s/AKfycbwZ3sxJOuhK3u5Rcx5oTUFwQpN3odvfM_l_N9r9JrNFop_LcUgmUs3ppPLeSgnPuTBs/exec" },
                    { "nombre": "Auxiliares", "liga": "https://script.google.com/macros/s/AKfycbz2IVH8kP0H3zSLLyFGea5nhzR-x8dzpvDgbNUC3VxSuLwhsbyJBw6i87aOFjfzUXsB/exec" },
                    { "nombre": "Llamadas por agente", "liga": "https://script.google.com/macros/s/AKfycbz_3p9lArAst7Yop4MBvABfabGTG6cpVpMtG1kw1szoscDgVSZNxHOds0V_s4LiON5WGA/exec" },
                    { "nombre": "HeadCount", "liga": "https://wfmpromass2026.pythonanywhere.com/" }
                ]
            }
        ];

        const contenedor = document.getElementById('app-container');
        
        catalogo.forEach(operacion => {
            let cardHTML = `<div class="card">
                                <h2>📁 ${operacion.nombre}</h2>
                                <ul class="report-list">`;
            
            operacion.reportes.forEach(reporte => {
                cardHTML += `<li>
                                <a href="${reporte.liga}" target="_blank" rel="noopener noreferrer">
                                    <span class="icon">📊</span> ${reporte.nombre}
                                </a>
                             </li>`;
            });
            
            cardHTML += `</ul></div>`;
            contenedor.innerHTML += cardHTML;
        });
    </script>
</body>
</html>
